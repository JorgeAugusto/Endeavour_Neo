backtest.strategy.breakout=Rompimento de padrão
strategy.breakout.family=Padrão
strategy.breakout.family.hint=O lado vem do padrão: um PFR de alta é uma mínima nova recusada, então compra-se o rompimento da máxima dele.
strategy.breakout.reward=Alvo (x risco)
strategy.breakout.reward.hint=A distância entrada-stop multiplicada por isto, para a relação pedida ser a relação medida.
strategy.breakout.valid=Entrada vale (barras)
strategy.breakout.valid.hint=Gatilho sem prazo ainda estaria de pé três semanas depois.
strategy.breakout.lot=Contratos
strategy.breakout.stop.hint=O stop é o extremo das três barras que formam o padrão, e não um número escolhido aqui: voltar além dele é o padrão ter falhado.
strategy.breakout.latch = Filtrar pelo estocástico
strategy.breakout.latch.hint = Atingir o nível ARMA um crédito de entradas, que os próximos padrões gastam. Atingir é um evento, e não um por barra dentro da zona.
strategy.breakout.latch.period = Período do estocástico
strategy.breakout.latch.average = Suavização
strategy.breakout.latch.scale.hint = Lido sempre em UM MINUTO, esteja o gráfico na escala que estiver: a leitura tem de ser a mesma com o gráfico em cinco minutos, ou em renko, onde não há minuto nenhum.
strategy.breakout.latch.buy = Arma compra em ou abaixo de
strategy.breakout.latch.sell = Arma venda em ou acima de
strategy.breakout.latch.entries = Entradas por armada
strategy.breakout.latch.entries.hint = Gasto pela entrada, não pelo plano: gatilho que expira sem ser tocado não custou nada ao mercado. Cada lado tem o seu crédito.
strategy.breakout.doubling = Dobrar a mão a cada stop
strategy.breakout.doubling.hint = É um martingale. Não cria vantagem — troca chance alta de ganho pequeno por chance pequena de perda enorme — e o custo sobe junto com a mão.
strategy.breakout.doubling.most = Quantas dobras
strategy.breakout.doubling.most.hint = Três dá 1, 2, 4, 8 contratos e para. A sequência volta a um em qualquer operação que feche no positivo, e no fim de todo pregão.
strategy.breakout.trend = Filtrar pelas duas médias
strategy.breakout.trend.hint = Cruzadas pra cima só compra, cruzadas pra baixo só vende. A tendência diz que lado pode ser operado; o estocástico diz que o mercado esticou o bastante para tentar.
strategy.breakout.trend.fast = Média rápida, em 1m
strategy.breakout.trend.slow = Média lenta, em 5m
strategy.breakout.trend.scale.hint = O valor de cinco minutos é sempre o do ÚLTIMO candle FECHADO, nunca o do candle em que este minuto está: esse ainda tem negócio por vir, e o fechamento dele é um preço que ninguém viu.
strategy.breakout.latch.reset = Desarma de volta em
strategy.breakout.latch.reset.hint = Crédito não é cupom sem prazo. Quando o estocástico voltou ao meio, o estição já acabou, e um padrão ali é um padrão em mercado comum.
backtest.strategy.fade = Fade de canal
strategy.fade.short = Canal menor (barras de 1m)
strategy.fade.long = Canal maior (barras de 1m)
strategy.fade.scale.hint = Os dois são ajustados em UM MINUTO, esteja o gráfico na escala que estiver, para os níveis não mudarem quando a escala do gráfico muda.
strategy.fade.lot = Contratos por degrau
strategy.fade.ladder.hint = Cada degrau é uma entrada própria, com o seu alvo, e eles são tomados do MAIS PERTO para o mais longe — só uma ordem fica de pé por vez, então nenhuma execução é casada a um degrau pelo preço.
strategy.fade.rung.short = Canal menor
strategy.fade.rung.long = Canal maior
strategy.fade.rung.entry = entra em
strategy.fade.rung.target = sai em
strategy.fade.nostop.hint = NÃO HÁ STOP. O lote sai no alvo dele ou no fim do pregão, e entre uma coisa e outra a perda é limitada só pelo relógio.
strategy.fade.latch.period = Período do estocástico (1m)
strategy.fade.latch.average = Suavização
strategy.fade.latch.buy = Arma compra em ou abaixo de
strategy.fade.latch.sell = Arma venda em ou acima de
strategy.fade.latch.reset = Desarma de volta em
strategy.fade.latch.entries = Entradas por armada
strategy.fade.latch.hint = Atingir o nível arma um crédito de entradas; voltar ao meio joga fora o que sobrou dele.
strategy.fade.flip = Stop quando os dois canais viram
strategy.fade.flip.hint = A entrada precisou dos dois canais concordando; os dois concordando para o outro lado é a tese retirada. A posição espera o primeiro pivô do zigzag DEPOIS da virada e para um tique além dele. Entre uma coisa e outra não há stop nenhum.
strategy.fade.flip.wing = Asa do zigzag
strategy.fade.flip.slip = Quanto o stop pode custar além do nível (pontos)
strategy.fade.flip.slip.hint = Um stop com o limite colado no próprio gatilho é RECUSADO quando a barra abre além do nível — medido. Esta é a folga que ele ganha; passando dela a execução é recusada de novo, o que também é verdade de um stop-limite real.
strategy.fade.guard = Stop na entrada, pelo zigzag
strategy.fade.guard.hint = Dos DOIS últimos fundos que a compra enxerga ao entrar, o menor, e o stop um tique abaixo dele. Havendo menos de dois, a entrada é recusada em vez de acontecer sem proteção. O segundo degrau traz os fundos de mais longe, e o nível passa a ser o dele.
strategy.fade.guard.wrongside.hint = Medido no seu ano: 2.210 das 4.337 entradas — 51% — saem com esse nível do lado ERRADO da compra, porque o fade compra abaixo de onde o mercado vinha e os dois últimos fundos ficam, portanto, acima. Um stop acima da compra dispara na abertura seguinte. As duas caixas abaixo são as duas saídas.
strategy.fade.guard.armed = Só entrar quando o nível protege
strategy.fade.guard.armed.hint = A entrada é recusada quando o nível ficaria do lado errado, do mesmo jeito que já é recusada quando há menos de dois pivôs. Cortou 51% das entradas naquele ano.
strategy.fade.guard.dip = Tirar o nível do próprio mergulho
strategy.fade.guard.dip.hint = O primeiro pivô CONFIRMADO depois da entrada, em vez dos dois anteriores — o fundo do mergulho em que o limite estava parado. Ele fica abaixo da entrada por construção, e custa a asa: a posição não carrega nível nenhum até esse pivô virar fato.
backtest.save = Salvar execuções
backtest.save.hint = Todas as execuções de todas as operações, em CSV: a hora, o verbo, o preço, quantos contratos ficaram abertos depois dela, e o que aquele giro realizou.
backtest.save.done = Execuções salvas em {0}
backtest.save.failed = Não deu para salvar as execuções: {0}
