settings.backtest.contracts.hint = O que uma ordem sem quantidade recebe - o NTSL chama de Quantidade por Ordem. Estratégia que diz a própria quantidade ignora isto.
backtest.pointValue = ponto vale
settings.backtest.point = Valor de um ponto
settings.backtest.perContract = por contrato
settings.backtest.point.hint = WIN 0,20 - IND 1,00 - WDO 10,00 - DOL 50,00. É do ativo, não da estratégia: rodar uma série de WDO com o valor do WIN erra por cinquenta vezes, e todo número em reais fica errado enquanto todo número em pontos continua certo.
