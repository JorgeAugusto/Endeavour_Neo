strategy.crossing.slow = Período lento
strategy.crossing.average = Média
strategy.crossing.periods.hint = Barras de cada média. A lenta é sempre mantida mais lenta que a rápida - ao contrário não é cruzamento.
strategy.crossing.average.hint = Nos mesmos períodos, os dois tipos cruzam em barras DIFERENTES. É o terceiro argumento das médias do NTSL, e o que decide se duas implementações batem.
strategy.average.exponential = pesada pelo recente, lembra de tudo
strategy.average.simple = média simples, esquece de uma vez
