# Brazilian Portuguese.
#
# ResourceBundle reads .properties as ISO-8859-1 up to Java 8; from Java 9 the
# default is UTF-8, which is what this file uses. Since the project targets
# Java 17 the accented characters below are safe as they are, with no \\uXXXX
# escaping needed.
#
# Keys absent here fall back to messages.properties, in English. That is a
# feature, not a gap: a half-translated interface still works.

