backtest.strategy.range90=Range 90
strategy.range90.formation=Formação (minutos)
strategy.range90.formation.hint=Minutos de relógio a partir do primeiro candle do pregão, não as 09:00 fixas nem 90 registros.
strategy.range90.window=Janela de entrada (minutos)
strategy.range90.window.hint=O rompimento tem que vir antes disso depois da formação, ou o dia é abandonado.
strategy.range90.lot=Contratos por lote
strategy.range90.cap=Máximo simultâneo
strategy.range90.lot.hint=Um lote no rompimento e mais um a cada pullback confirmado, até o teto.
strategy.range90.target.hint=Só vale com a caixa acima marcada. Com a seleção ligada o alvo é 1,5R ou 2R e a estratégia escolhe todo dia de manhã, a partir dos pregões anteriores.
backtest.wrong.empty=nenhuma operação: a estratégia não entrou neste trecho
backtest.stage.opening=abrindo a série
backtest.stage.ticks=caminhando os ticks
backtest.stage.running=rodando
strategy.range90.closeAt=Encerrar tudo às
strategy.range90.closeAt.hint=Qualquer posição ainda aberta é fechada nesse horário, aconteça o que acontecer no resto do pregão.
strategy.range90.trend=Filtro de tendência (EMA 10 diária)
strategy.range90.trend.hint=Ligado, a média diária recusa o pregão cujo rompimento vem contra ela e ainda decide de que lado o dia pode operar. Desligado, quem escolhe o lado é a metade do range em que o preço está, relida a cada fechamento -- então um rompimento que vem da outra metade de uma vez encontra a borda errada armada e é perdido. O filtro está na especificação, e todo número de Range 90 publicado aqui foi medido com ele ligado.
strategy.range90.everyDay=Operar todos os pregões (sem seleção)
strategy.range90.everyDay.hint=Desligado, duas coisas recusam um pregao: o seletor, que quer vinte pregoes antes de autorizar um, e a media diaria, que recusa tudo ate ter onze. Ligado, nenhuma das duas espera -- todo pregao que rompe e operado no alvo fixo abaixo. A media continua escolhendo o LADO, entao os dois primeiros pregoes do recorte ainda ficam de fora, e uma inclinacao lida em tres fechamentos e ruidosa.
strategy.range90.target=Alvo fixo (R)
