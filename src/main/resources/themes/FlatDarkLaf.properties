# A paleta do tema NOTURNO.
#
# O FlatLaf le este arquivo quando o pacote "temas" e registrado como fonte de
# defaults (ver Aparencia.instalar). O nome do arquivo tem de casar com a classe
# do look-and-feel que se quer alterar -- FlatDarkLaf -- e por isso o registro
# so acontece quando o tema noturno esta selecionado: caso contrario ele
# afetaria tambem o modo escuro comum.
#
# Vale mexer nas cores BASE e deixar o FlatLaf derivar o resto. Ele calcula
# dezenas de tons a partir destas poucas, mantendo relacoes de contraste entre
# fundo, borda, selecao e texto desabilitado. Sobrescrever chave a chave produz
# a incoerencia classica: um painel que ficou marrom ao lado de um menu que
# continuou azul.

# ---------------------------------------------------------------- as bases
#
# Marrom-acinzentado, nao preto. Preto puro atras de texto claro produz halo
# no escuro -- o olho adapta para o fundo e o texto "vaza". Um fundo com algum
# brilho reduz esse efeito sem clarear a sala.
@background = #2A2622

# Creme, nao branco. Branco puro sobre fundo escuro e o par de maior contraste
# possivel, e maior contraste nao e melhor a noite: e o que cansa.
@foreground = #D6CCBE

# Ambar no lugar do azul do FlatDarkLaf. A luz azul e a que mais suprime a
# melatonina; e a cor de destaque aparece em selecao, foco e barra de rolagem,
# ou seja, o tempo todo.
@accentColor = #C98A3E

# ------------------------------------------------------- selecao e destaque
@selectionBackground = #4A3B28
@selectionForeground = #F0E6D8

@selectionInactiveBackground = #38322B
@selectionInactiveForeground = #C0B5A6

# Texto apagado com folga suficiente para ainda ser legivel: no escuro, o
# desabilitado padrao costuma sumir por completo.
@disabledText = #8A8073

# --------------------------------------------------------------- estrutura
#
# Bordas discretas. A noite a estrutura deve ser sentida, nao lida.
Component.borderColor = #3D3730
Component.disabledBorderColor = #332E28
Component.focusedBorderColor = #C98A3E
Component.focusColor = #C98A3E

Separator.foreground = #3D3730

# A area de trabalho um tom abaixo do fundo, para as abas se destacarem sem
# precisar de borda forte.
TabbedPane.background = #241F1C
TabbedPane.underlineColor = #C98A3E
TabbedPane.selectedBackground = #2A2622

# O console imita terminal: um degrau mais escuro que o resto.
TextArea.background = #211D1A
TextArea.foreground = #CFC4B4

# Tabela e arvore com listras muito sutis; no escuro, listra forte vira ruido.
Table.alternateRowColor = #2F2A26
Tree.background = #2A2622
Table.background = #2A2622

# O rodape e a barra de ferramentas se separam do centro pelo tom, sem linha.
ToolBar.background = #262220
MenuBar.background = #262220
