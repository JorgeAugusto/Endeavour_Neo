# Base bundle -- ENGLISH.
#
# This is the fallback for every locale without its own file, so it must stay
# complete: a key missing here shows up as !key.name! in the interface.
#
# Keys ending in .mnemonic hold the underlined letter for a menu. They belong in
# the bundle because the letter differs per language -- "File" wants F and
# "Arquivo" wants A -- so hard-coding the key code in the window would quietly
# break every translation.

