overlay.lt.anchoring.SEARCH.hint = Every turn of the window is tried as the anchor and the one with most touches wins -- the only mode where the tolerance ladder decides anything
overlay.lt.anchoring.EXTREME.hint = No search: the line comes off the high of the window, and may well pass above every later top
overlay.lt.anchoring.FAST_AVERAGE.hint = The anchor comes from the last time the PRICE crossed the fast average, and the far end is the newest turn there is -- so every new top or bottom drags the line forward and turns it
overlay.lt.anchoring.SLOW_AVERAGE.hint = The same rule against a slower average on a larger scale: the price crosses it far less often, so the anchor survives much longer and the line spans the whole move
overlay.lt.anchoring.LAST_CROSSING.hint = Both ends come from the crossing of the price with the fast average: the resistance joins the last top before it to the first top after, and the support does the same with the bottoms -- short lines that change often
