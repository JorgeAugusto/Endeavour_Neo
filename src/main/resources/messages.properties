backtest.strategy.breakout=Pattern breakout
strategy.breakout.family=Pattern
strategy.breakout.family.hint=The side comes from the pattern: a PFR up is a new low refused, so one buys the break of its high.
strategy.breakout.reward=Target (x risk)
strategy.breakout.reward.hint=The entry-to-stop distance times this, so the ratio asked for is the ratio measured.
strategy.breakout.valid=Entry lives for (bars)
strategy.breakout.valid.hint=A trigger with no expiry would still be standing three weeks later.
strategy.breakout.lot=Contracts
strategy.breakout.stop.hint=The stop is the extreme of the three bars that make the pattern, not a number chosen here: going beyond it is the pattern having failed.
strategy.breakout.latch = Filter on the stochastic
strategy.breakout.latch.hint = Reaching the level ARMS a credit of entries, which the next patterns spend. Reaching it is one event, not one per bar inside the zone.
strategy.breakout.latch.period = Stochastic period
strategy.breakout.latch.average = Smoothing
strategy.breakout.latch.scale.hint = Always read on ONE MINUTE, whatever the chart is on: the reading is meant to be the same with the chart on five minutes, or on renko, where there is no minute at all.
strategy.breakout.latch.buy = Arms buys at or below
strategy.breakout.latch.sell = Arms sells at or above
strategy.breakout.latch.entries = Entries per arming
strategy.breakout.latch.entries.hint = Spent by an entry, not by a plan: a trigger that expires untouched cost the market nothing. Each side keeps its own credit.
strategy.breakout.doubling = Double the lot after a loss
strategy.breakout.doubling.hint = A martingale. It cannot create an edge -- it trades a high chance of a small gain for a small chance of a very large loss -- and the costs rise with the lot.
strategy.breakout.doubling.most = How many doublings
strategy.breakout.doubling.most.hint = Three gives 1, 2, 4, 8 contracts and stops. The sequence goes back to one on any trade that closed positive, and at the end of every session.
strategy.breakout.trend = Filter on the two averages
strategy.breakout.trend.hint = Crossed up only buys, crossed down only sells. The trend says which side may be traded at all; the stochastic says the market is stretched enough to try.
strategy.breakout.trend.fast = Fast average, on 1m
strategy.breakout.trend.slow = Slow average, on 5m
strategy.breakout.trend.scale.hint = The five-minute value is always the LAST CLOSED bar, never the one this minute is inside: that one still has trading to come, and its close is a price nobody has seen.
strategy.breakout.latch.reset = Disarms back at
strategy.breakout.latch.reset.hint = A credit is not a coupon with no expiry. By the time the stochastic has climbed back to the middle the stretch is spent, and a pattern then is one in an ordinary market.
backtest.strategy.fade = Channel fade
strategy.fade.short = Short channel (bars of 1m)
strategy.fade.long = Long channel (bars of 1m)
strategy.fade.scale.hint = Both are fitted on ONE MINUTE whatever the chart is on, so the levels do not move when the chart scale does.
strategy.fade.lot = Contracts per rung
strategy.fade.ladder.hint = Each rung is an entry of its own, with its own target, and they are taken NEAREST first -- only one order rests at a time, so a fill is never matched to a rung by its price.
strategy.fade.rung.short = Short channel
strategy.fade.rung.long = Long channel
strategy.fade.rung.entry = in at
strategy.fade.rung.target = out at
strategy.fade.nostop.hint = THERE IS NO STOP. A lot leaves at its target or at the end of the session, and in between the loss is bounded only by the clock.
strategy.fade.latch.period = Stochastic period (1m)
strategy.fade.latch.average = Smoothing
strategy.fade.latch.buy = Arms buys at or below
strategy.fade.latch.sell = Arms sells at or above
strategy.fade.latch.reset = Disarms back at
strategy.fade.latch.entries = Entries per arming
strategy.fade.latch.hint = Reaching the level arms a credit of entries; coming back to the middle throws away whatever is left of it.
strategy.fade.flip = Stop when both channels turn
strategy.fade.flip.hint = The entry needed both channels agreeing; both agreeing the other way is the thesis withdrawn. The position waits for the first zigzag pivot AFTER the turn and stops one tick past it. There is no stop at all in between.
strategy.fade.flip.wing = Zigzag wing
strategy.fade.flip.slip = Most the stop may cost past the level (points)
strategy.fade.flip.slip.hint = A stop whose limit sits on its own trigger is REFUSED when the bar opens past the level -- measured. This is the room it gets; past it the fill is refused again, which is true of a real stop-limit too.
strategy.fade.guard = Stop at the entry, off the zigzag
strategy.fade.guard.hint = Of the TWO most recent bottoms a buy can see when it goes on, the lower one, and the stop a tick under it. With fewer than two, the entry is refused rather than taken unprotected. The second rung brings the bottoms from further out, and the level moves to its.
strategy.fade.guard.wrongside.hint = Measured on his year: 2.210 of 4.337 entries -- 51% -- come out with that level on the WRONG side of the buy, because a fade buys below where the market had been and the last two bottoms are therefore above it. A stop above the buy fires at the next open. The two boxes below are the two ways out.
strategy.fade.guard.armed = Only enter when the level protects
strategy.fade.guard.armed.hint = The entry is refused when the level would sit on the wrong side, the same way it is refused when there are fewer than two pivots. It cut 51% of the entries in that year.
strategy.fade.guard.dip = Take the level from the dip being bought
strategy.fade.guard.dip.hint = The first pivot CONFIRMED after the entry instead of the two before it -- the bottom of the dip the limit was sitting in. It is below the entry by construction, and it costs the wing: the position carries no level of its own until that pivot is a fact.
backtest.save = Save executions
backtest.save.hint = Every execution of every trade, as a CSV: the clock, the verb, the price, how many contracts were open after it, and what that turn realised.
backtest.save.done = Executions saved to {0}
backtest.save.failed = The executions could not be saved: {0}
backtest.strategy.tno = TNO
strategy.tno.change = Rate of change (bars)
strategy.tno.first = First smoothing
strategy.tno.second = Second smoothing
strategy.tno.signal = Signal
strategy.tno.periods.hint = The PMO of JorgeReis_TNO_PMO: rate of change of the close, smoothed twice, and the signal as an average of that. It is read on the SCALE OF THE RUN -- five minutes here is the five-minute crossing.
strategy.tno.lot = Contracts
strategy.tno.slip = Stop slippage (points)
strategy.tno.slip.hint = How far past its trigger the protective stop may still fill. With zero it refuses the fill on a bar that opens beyond the level -- which is the bar a stop exists for.
strategy.tno.rule.hint = Up-cross buys, down-cross sells short, at market. The stop is the extreme of the signal candle and the target is 2R from the fill. A signal while positioned closes the trade and opens the other side, in that order.
