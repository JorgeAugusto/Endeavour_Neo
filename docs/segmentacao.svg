<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <style>
      .ink { fill: #23201d; } .dim { fill: #7c746a; } .faint { fill: #a49a8e; }
      .t   { font-size: 12.5px; } .ts { font-size: 11px; }
      .tt  { font-size: 13.5px; font-weight: 600; }
      .hd  { font-size: 16px; font-weight: 600; }
      .num { font-family: Consolas, ui-monospace, monospace; font-size: 11px; }
      .box { fill: #ffffff; stroke: #c9c1b6; stroke-width: 1; }
      .rule{ stroke: #c9c1b6; stroke-width: 1; }
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8a8074"/>
    </marker>
  </defs>
  <rect width="1060" height="560" fill="#f7f5f1"/>

  <text x="40" y="38" class="hd ink">Base → Segmentação → Escala</text>
  <text x="40" y="58" class="t dim">Uma fatia não copia nada do disco: ela traduz índice sobre a base.</text>

  <!-- ================= a linha do tempo ================= -->
  <g transform="translate(40,96)">
    <text x="0" y="-10" class="tt ink">winn-1m.bin</text>
    <text x="120" y="-10" class="ts faint">ago/2021 — set/2026 · 1 minuto</text>

    <!-- trilho -->
    <rect x="0" y="0" width="900" height="34" fill="#ece7df" stroke="#c9c1b6"/>

    <!-- ESTUDO -->
    <rect x="0" y="0" width="560" height="34" fill="#2f7d4f" fill-opacity="0.16" stroke="#2f7d4f"/>
    <text x="14" y="15" class="ts" fill="#1f5a38" font-weight="700">ESTUDO</text>
    <text x="14" y="28" class="ts" fill="#1f5a38">Estudo 2021-08 → 2024-12</text>
    <text x="450" y="15" class="num" fill="#1f5a38">consultada 137×</text>
    <text x="450" y="28" class="num" fill="#1f5a38">limiar t ≈ 2,86</text>

    <!-- PROVA -->
    <rect x="560" y="0" width="340" height="34" fill="#b06a2c" fill-opacity="0.16" stroke="#b06a2c"/>
    <text x="574" y="15" class="ts" fill="#8a4f1c" font-weight="700">PROVA</text>
    <text x="574" y="28" class="ts" fill="#8a4f1c">Prova 2025-01 → em diante</text>
    <text x="800" y="15" class="num" fill="#8a4f1c">consultada 0×</text>
    <text x="800" y="28" class="num" fill="#8a4f1c">intacta</text>

    <!-- eixo -->
    <g transform="translate(0,42)">
      <line x1="0" y1="0" x2="900" y2="0" class="rule"/>
      <g class="ts faint">
        <text x="-6" y="14">2021</text><text x="150" y="14">2022</text>
        <text x="300" y="14">2023</text><text x="450" y="14">2024</text>
        <text x="600" y="14">2025</text><text x="750" y="14">2026</text>
      </g>
      <line x1="560" y1="-4" x2="560" y2="6" stroke="#b06a2c" stroke-width="2"/>
    </g>

    <!-- TUDO -->
    <g transform="translate(0,76)">
      <rect x="0" y="0" width="900" height="22" fill="#ffffff" stroke="#c9c1b6" stroke-dasharray="4 3"/>
      <text x="14" y="15" class="ts dim"><tspan font-weight="700">TUDO</tspan>  — só relatório, nunca ajuste. Contaminada por construção, e a tela diz isso.</text>
    </g>
  </g>

  <!-- ================= os dois niveis ================= -->
  <g transform="translate(40,300)">
    <text x="0" y="0" class="tt ink">Dois níveis, e os dois precisam existir</text>

    <g transform="translate(0,20)">
      <rect x="0" y="0" width="430" height="150" class="box"/>
      <rect x="0" y="0" width="430" height="26" fill="#f0ede7"/>
      <text x="12" y="18" class="t ink" font-weight="600">A fatia — escolha sua, dura meses</text>
      <text x="12" y="50" class="ts dim">Responde: <tspan class="ink">que anos este trabalho pode olhar.</tspan></text>
      <text x="12" y="74" class="ts dim">Cadastrada uma vez, em Preferências.</text>
      <text x="12" y="98" class="ts dim">Sem ela, a prova final não existe — 500 rodadas</text>
      <text x="12" y="114" class="ts dim">acabam vendo tudo, uma de cada vez.</text>
      <text x="12" y="138" class="ts" fill="#8a4f1c">ESTUDO e PROVA não podem se sobrepor.</text>
    </g>

    <g transform="translate(470,20)">
      <rect x="0" y="0" width="430" height="150" class="box"/>
      <rect x="0" y="0" width="430" height="26" fill="#f0ede7"/>
      <text x="12" y="18" class="t ink" font-weight="600">O corte à frente — da rodada, automático</text>
      <text x="12" y="50" class="ts dim">Responde: <tspan class="ink">dentro do que posso olhar,</tspan></text>
      <text x="12" y="66" class="ts ink">o que escondo de mim mesmo nesta rodada.</text>
      <text x="12" y="90" class="ts dim">1/2, 1/3 ou 1/4, como no MetaTrader.</text>
      <text x="12" y="114" class="ts dim">Sem ele, cada rodada individual mente.</text>
      <text x="12" y="138" class="ts" fill="#8a4f1c">Um não substitui o outro.</text>
    </g>
  </g>

  <!-- ================= a cadeia ================= -->
  <g transform="translate(40,494)">
    <rect x="0" y="0" width="150" height="30" class="box"/><text x="16" y="20" class="t ink">winn-1m.bin</text>
    <line x1="152" y1="15" x2="196" y2="15" stroke="#8a8074" marker-end="url(#a)"/>
    <rect x="200" y="0" width="176" height="30" fill="#2f7d4f" fill-opacity="0.14" stroke="#2f7d4f"/>
    <text x="214" y="20" class="t" fill="#1f5a38">Estudo 2021–2024</text>
    <line x1="378" y1="15" x2="422" y2="15" stroke="#8a8074" marker-end="url(#a)"/>
    <rect x="426" y="0" width="110" height="30" class="box"/><text x="446" y="20" class="t ink">5 minutos</text>
    <line x1="538" y1="15" x2="582" y2="15" stroke="#8a8074" marker-end="url(#a)"/>
    <rect x="586" y="0" width="240" height="30" fill="#f0ede7" stroke="#c9c1b6"/>
    <text x="600" y="20" class="t dim">amostra 2/3 │ à frente 1/3</text>
    <text x="840" y="20" class="ts faint">← dentro da rodada</text>
  </g>
</svg>
