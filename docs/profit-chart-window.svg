<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 880" width="1260" height="880"
     font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">

  <title>Anatomy of a trading chart window — Nelogica Profit, WINFUT 15Min</title>

  <defs>
    <style>
      .frame  { fill: #fbfbfa; stroke: #3d3a36; stroke-width: 1.6; }
      .zone   { fill: #ffffff; stroke: #8c8781; stroke-width: 1.1; }
      .fill   { fill: #f1efec; stroke: #a9a49d; stroke-width: 1; }
      .ghost  { fill: #e6e3df; stroke: none; }
      .rule   { stroke: #c8c3bc; stroke-width: 1; }
      .lbl    { font-size: 12px; fill: #3d3a36; }
      .dim    { font-size: 11px; fill: #7d7770; }
      .mono   { font-family: Consolas, "SF Mono", monospace; font-size: 11px; fill: #55504a; }
      .badge  { fill: #b45309; }
      .badget { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .head   { font-size: 13px; font-weight: 600; fill: #26231f; }
      .note   { font-size: 11.5px; fill: #b45309; }
      .accent { fill: #b45309; }
    </style>

    <g id="candleUp">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#55504a" stroke-width="1"/>
      <rect x="-3.5" y="-8" width="7" height="16" fill="#ffffff" stroke="#55504a" stroke-width="1"/>
    </g>
    <g id="candleDown">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#55504a" stroke-width="1"/>
      <rect x="-3.5" y="-8" width="7" height="16" fill="#55504a"/>
    </g>
  </defs>

  <rect width="1260" height="880" fill="#fbfbfa"/>

  <text x="24" y="30" class="head" font-size="16">Anatomia de uma janela de gráfico</text>
  <text x="24" y="48" class="dim">Nelogica Profit · WINFUT 15Min · 02/09/2026 · mapeado para o Endeavour Neo</text>

