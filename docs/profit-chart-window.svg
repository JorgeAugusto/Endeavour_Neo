  <text x="38" y="150" class="mono">JorgeReis_EMAs_1m_5m [17 21 0 8 21]</text>
  <g class="mono">
    <rect x="272" y="138" width="52" height="16" rx="2" class="ghost"/><text x="278" y="150">187.945</text>
    <rect x="330" y="138" width="52" height="16" rx="2" class="ghost"/><text x="336" y="150">187.879</text>
    <rect x="388" y="138" width="52" height="16" rx="2" class="ghost"/><text x="394" y="150">187.160</text>
