  <!-- ══════════════════════════════════════════════════ crachás -->
  <g>
    <circle cx="40"   cy="83"  r="9" class="badge"/><text x="40"   y="87"  class="badget" text-anchor="middle">A</text>
    <circle cx="1220" cy="116" r="9" class="badge"/><text x="1220" y="120" class="badget" text-anchor="middle">B</text>
    <circle cx="1220" cy="146" r="9" class="badge"/><text x="1220" y="150" class="badget" text-anchor="middle">C</text>
    <circle cx="41"   cy="252" r="9" class="badge"/><text x="41"   y="256" class="badget" text-anchor="middle">D</text>
    <circle cx="80"   cy="180" r="9" class="badge"/><text x="80"   y="184" class="badget" text-anchor="middle">E</text>
    <circle cx="952"  cy="180" r="9" class="badge"/><text x="952"  y="184" class="badget" text-anchor="middle">F</text>
    <circle cx="42"   cy="580" r="9" class="badge"/><text x="42"   y="584" class="badget" text-anchor="middle">G</text>
    <circle cx="1030" cy="176" r="9" class="badge"/><text x="1030" y="180" class="badget" text-anchor="middle">H</text>
    <circle cx="42"   cy="617" r="9" class="badge"/><text x="42"   y="621" class="badget" text-anchor="middle">I</text>
  </g>

  <!-- ══════════════════════════════════════════════════ legenda -->
  <line x1="24" y1="726" x2="1236" y2="726" class="rule"/>

  <g class="lbl">
    <text x="24" y="748" class="head">Zonas</text>

    <circle cx="34"  cy="770" r="8" class="badge"/><text x="34"  y="774" class="badget" text-anchor="middle">A</text>
    <text x="50" y="774">barra de janela — aba do ativo, variação do dia, relógio</text>

    <circle cx="34"  cy="796" r="8" class="badge"/><text x="34"  y="800" class="badget" text-anchor="middle">B</text>
    <text x="50" y="800">cabeçalho — OHLC da barra, variação, ajuste</text>

    <circle cx="34"  cy="822" r="8" class="badge"/><text x="34"  y="826" class="badget" text-anchor="middle">C</text>
    <text x="50" y="826">legenda de indicadores — nome, parâmetros, valor por linha</text>

    <circle cx="34"  cy="848" r="8" class="badge"/><text x="34"  y="852" class="badget" text-anchor="middle">D</text>
    <text x="50" y="852">botões do indicador — a confirmar</text>

    <circle cx="440" cy="770" r="8" class="badge"/><text x="440" y="774" class="badget" text-anchor="middle">E</text>
    <text x="456" y="774">área do gráfico — candles, sem grade horizontal</text>

    <circle cx="440" cy="796" r="8" class="badge"/><text x="440" y="800" class="badget" text-anchor="middle">F</text>
    <text x="456" y="800">eixo de preços — rótulos e etiqueta de dois valores</text>

    <circle cx="440" cy="822" r="8" class="badge"/><text x="440" y="826" class="badget" text-anchor="middle">G</text>
    <text x="456" y="826">eixo de tempo — horas em cima, DIA numa faixa separada</text>

    <circle cx="440" cy="848" r="8" class="badge"/><text x="440" y="852" class="badget" text-anchor="middle">I</text>
    <text x="456" y="852">abas de espaço de trabalho — doze layouts salvos</text>

    <circle cx="856" cy="770" r="8" class="badge"/><text x="856" y="774" class="badget" text-anchor="middle">H</text>
    <text x="872" y="774">painel de ordens — conta, preço, stop, quantidade,</text>
    <text x="872" y="796">compra e venda a limite e a mercado, zerar e inverter,</text>
    <text x="872" y="818">resultado aberto e do dia</text>
    <text x="872" y="846" class="note">é o que o modo simulador precisa reproduzir</text>
