    <rect x="1120" y="372" width="94" height="22" rx="2" class="fill"/><text x="1167" y="387">V Mercado</text>
    <rect x="1022" y="400" width="94" height="22" rx="2" class="fill"/><text x="1069" y="415">Cancel Ord.</text>
    <rect x="1120" y="400" width="94" height="22" rx="2" class="fill"/><text x="1167" y="415">Inverter</text>
    <rect x="1022" y="428" width="192" height="22" rx="2" class="accent"/>
    <text x="1118" y="443" fill="#ffffff">Zerar</text>
    <rect x="1022" y="456" width="192" height="22" rx="2" class="accent"/>
    <text x="1118" y="471" fill="#ffffff" font-size="11">Cancelar ordens + Zerar</text>
