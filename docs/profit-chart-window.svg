    <text x="1022" y="284">Qtd</text>
    <rect x="1096" y="273" width="118" height="15" rx="2" class="fill"/>
    <text x="1206" y="284" class="mono" text-anchor="end">1</text>
  </g>

  <g>
    <rect x="1022" y="294" width="60" height="18" rx="2" class="fill"/><text x="1048" y="307" class="lbl">1</text>
    <rect x="1090" y="294" width="60" height="18" rx="2" class="fill"/><text x="1116" y="307" class="lbl">2</text>
    <rect x="1156" y="294" width="58" height="18" rx="2" class="fill"/><text x="1181" y="307" class="lbl">3</text>
