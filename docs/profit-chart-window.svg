    <use href="#candleUp"   x="290" y="352"/>
    <use href="#candleUp"   x="320" y="318"/>
    <use href="#candleDown" x="350" y="330"/>
    <use href="#candleDown" x="380" y="356"/>
    <use href="#candleUp"   x="410" y="340"/>
    <use href="#candleDown" x="440" y="362"/>
    <use href="#candleUp"   x="470" y="344"/>
    <use href="#candleUp"   x="500" y="322"/>
    <use href="#candleDown" x="530" y="334"/>
    <use href="#candleUp"   x="560" y="312"/>
    <use href="#candleUp"   x="590" y="296"/>
    <use href="#candleDown" x="620" y="304"/>
    <use href="#candleUp"   x="650" y="288"/>
    <use href="#candleUp"   x="680" y="276"/>
    <use href="#candleDown" x="710" y="282"/>
