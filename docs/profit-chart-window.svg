  <circle cx="44" cy="83" r="6" fill="none" stroke="#8c8781"/>
  <rect x="60" y="72" width="168" height="22" rx="2" fill="#ffffff" stroke="#8c8781"/>
  <text x="70" y="87" class="lbl">WINFUT 15Min</text>
  <text x="168" y="87" class="lbl accent">+3,04%</text>
  <text x="216" y="87" class="dim">✕</text>
  <text x="238" y="87" class="dim">+</text>
  <text x="1030" y="87" class="mono">02/09/2026 18:15</text>
  <text x="1150" y="87" class="dim">⋯   ─   □   ✕</text>

  <!-- ─────────────────────────────── B · cabeçalho -->
  <rect x="24" y="100" width="1212" height="32" class="zone"/>
  <circle cx="42" cy="116" r="5" fill="none" stroke="#8c8781"/>
