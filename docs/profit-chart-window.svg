  <rect x="932" y="160" width="80" height="386" class="zone"/>
  <g class="mono" text-anchor="end">
    <text x="1004" y="182">190.310</text>
    <text x="1004" y="222">189.615</text>
    <text x="1004" y="262">188.920</text>
    <text x="1004" y="302">188.225</text>
