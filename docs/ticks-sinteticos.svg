  <g transform="translate(60,442)">
    <text x="0" y="0" class="tt">As quatro regras</text>
    <text x="0" y="26" class="cap"><tspan class="acc">1.</tspan> A ordem depende da direção: barra de alta vai <tspan class="ink">A → mínima → máxima → F</tspan>; de baixa, A → máxima → mínima → F.</text>
    <text x="0" y="48" class="cap"><tspan class="acc">2.</tspan> Cada trecho é uma <tspan class="ink">ponte browniana</tspan> — o ruído morre nas pontas, então chega exatamente no alvo sem salto no último passo.</text>
    <text x="0" y="70" class="cap"><tspan class="acc">3.</tspan> Quantos: <tspan class="ink">4 + 2 × (amplitude em ticks)</tspan>, com piso 6 e teto 60. Barra grande ganha mais movimento; doji ganha poucos.</text>
    <text x="0" y="92" class="cap"><tspan class="acc">4.</tspan> Os intermediários caem na <tspan class="ink">grade de 5 pontos</tspan>; abertura, máxima, mínima e fechamento são os valores <tspan class="ink">verdadeiros</tspan> da barra.</text>
    <text x="0" y="122" class="cap">O caminho é invenção: reproduz as quatro pontas verdadeiras e o resto é plausível. Vale para assistir, <tspan class="ink">não para medir</tspan>.</text>
  </g>
