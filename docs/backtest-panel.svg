        <g transform="translate(40,0)"><line x1="0" y1="60" x2="0" y2="120"/><rect x="-4" y="72" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(64,0)"><line x1="0" y1="70" x2="0" y2="132"/><rect x="-4" y="86" width="8" height="30" fill="#6f665b"/></g>
        <g transform="translate(88,0)"><line x1="0" y1="76" x2="0" y2="140"/><rect x="-4" y="92" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(112,0)"><line x1="0" y1="58" x2="0" y2="118"/><rect x="-4" y="66" width="8" height="40" fill="#fbfaf8"/></g>
        <g transform="translate(136,0)"><line x1="0" y1="52" x2="0" y2="108"/><rect x="-4" y="60" width="8" height="30" fill="#6f665b"/></g>
        <g transform="translate(160,0)"><line x1="0" y1="66" x2="0" y2="126"/><rect x="-4" y="80" width="8" height="32" fill="#6f665b"/></g>
        <g transform="translate(184,0)"><line x1="0" y1="80" x2="0" y2="146"/><rect x="-4" y="96" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(208,0)"><line x1="0" y1="90" x2="0" y2="150"/><rect x="-4" y="104" width="8" height="30" fill="#fbfaf8"/></g>
        <g transform="translate(232,0)"><line x1="0" y1="74" x2="0" y2="134"/><rect x="-4" y="86" width="8" height="34" fill="#6f665b"/></g>
        <g transform="translate(256,0)"><line x1="0" y1="60" x2="0" y2="122"/><rect x="-4" y="72" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(280,0)"><line x1="0" y1="50" x2="0" y2="112"/><rect x="-4" y="62" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(304,0)"><line x1="0" y1="64" x2="0" y2="126"/><rect x="-4" y="78" width="8" height="32" fill="#6f665b"/></g>
        <g transform="translate(360,0)"><line x1="0" y1="84" x2="0" y2="146"/><rect x="-4" y="98" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(384,0)"><line x1="0" y1="70" x2="0" y2="132"/><rect x="-4" y="82" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(408,0)"><line x1="0" y1="58" x2="0" y2="118"/><rect x="-4" y="70" width="8" height="32" fill="#6f665b"/></g>
        <g transform="translate(432,0)"><line x1="0" y1="72" x2="0" y2="136"/><rect x="-4" y="88" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(456,0)"><line x1="0" y1="88" x2="0" y2="152"/><rect x="-4" y="102" width="8" height="36" fill="#6f665b"/></g>
        <g transform="translate(480,0)"><line x1="0" y1="76" x2="0" y2="140"/><rect x="-4" y="90" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(504,0)"><line x1="0" y1="62" x2="0" y2="124"/><rect x="-4" y="74" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(528,0)"><line x1="0" y1="54" x2="0" y2="116"/><rect x="-4" y="66" width="8" height="32" fill="#6f665b"/></g>
        <g transform="translate(568,0)"><line x1="0" y1="68" x2="0" y2="130"/><rect x="-4" y="82" width="8" height="34" fill="#fbfaf8"/></g>
        <g transform="translate(592,0)"><line x1="0" y1="80" x2="0" y2="144"/><rect x="-4" y="94" width="8" height="36" fill="#fbfaf8"/></g>
        <g transform="translate(616,0)"><line x1="0" y1="66" x2="0" y2="128"/><rect x="-4" y="78" width="8" height="34" fill="#6f665b"/></g>
      </g>

      <!-- operacoes -->
      <path d="M64 148 L136 96" class="up" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="64,152 59,162 69,162" class="up"/>
      <polygon points="136,92 131,82 141,82" class="up"/>
      <path d="M232 150 L304 168" class="down" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="232,154 227,164 237,164" class="down"/>
      <polygon points="304,172 299,182 309,182" class="down"/>
      <path d="M432 156 L528 106" class="up" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="432,160 427,170 437,170" class="up"/>
      <polygon points="528,102 523,92 533,92" class="up"/>

      <!-- fronteira do "a frente" -->
      <line x1="340" y1="0" x2="340" y2="250" stroke="#b06a2c" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="342" y="6" width="86" height="16" fill="#b06a2c"/>
      <text x="348" y="18" class="ts" fill="#ffffff">à frente ▸</text>

      <line x1="0" y1="250" x2="740" y2="250" class="rule"/>
