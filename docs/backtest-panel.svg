      <rect x="673" y="0" width="66" height="250" fill="#f4f1ec"/>
      <line x1="673" y1="0" x2="673" y2="250" class="rule"/>
      <text x="681" y="30" class="num faint">188.035</text>
      <text x="681" y="90" class="num faint">187.900</text>
      <text x="681" y="150" class="num faint">187.760</text>
      <rect x="673" y="112" width="66" height="15" fill="#b06a2c"/>
      <text x="681" y="123" class="num" fill="#ffffff">187.901</text>

