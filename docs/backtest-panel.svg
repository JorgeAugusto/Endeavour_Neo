<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <style>
      .ink   { fill: #23201d; }
      .dim   { fill: #7c746a; }
      .faint { fill: #a49a8e; }
      .panel { fill: #ffffff; stroke: #c9c1b6; stroke-width: 1; }
      .sunk  { fill: #f4f1ec; stroke: #c9c1b6; stroke-width: 1; }
      .plot  { fill: #fbfaf8; stroke: #c9c1b6; stroke-width: 1; }
      .rule  { stroke: #c9c1b6; stroke-width: 1; }
      .hair  { stroke: #ded7cd; stroke-width: 1; }
      .btn   { fill: #efebe4; stroke: #b9b0a4; stroke-width: 1; }
      .on    { fill: #b06a2c; }
      .up    { fill: #2f7d4f; stroke: #2f7d4f; }
      .down  { fill: #a83a2d; stroke: #a83a2d; }
      .t     { font-size: 12px; }
      .ts    { font-size: 10.5px; }
      .tt    { font-size: 13px; font-weight: 600; }
      .num   { font-family: Consolas, ui-monospace, monospace; font-size: 11px; }
      .call  { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .cap   { font-size: 12.5px; }
      .head  { font-size: 15px; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#b06a2c"/>
