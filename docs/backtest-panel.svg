      <rect x="8" y="3" width="52" height="18" fill="#ffffff" stroke="#b9b0a4"/><text x="16" y="16" class="ts ink">Limpo</text>
      <rect x="64" y="3" width="96" height="18" class="btn"/><text x="72" y="16" class="ts dim">Topos e fundos</text>
      <rect x="164" y="3" width="66" height="18" class="btn"/><text x="172" y="16" class="ts dim">Tendência</text>
      <rect x="234" y="3" width="20" height="18" class="btn"/><text x="241" y="16" class="ts dim">+</text>
      <line x1="0" y1="24" x2="740" y2="24" class="rule"/>
    </g>

    <!-- (1) linha de comando -->
    <g transform="translate(0,389)">
      <rect x="1" y="0" width="738" height="56" fill="#eae5dd"/>
      <line x1="0" y1="0" x2="740" y2="0" stroke="#b06a2c" stroke-width="2"/>

      <rect x="10" y="8" width="122" height="19" rx="9" fill="#ffffff" stroke="#b9b0a4"/>
      <rect x="10" y="8" width="62" height="19" rx="9" class="on"/>
      <text x="20" y="21" class="ts" fill="#ffffff">Backtest</text>
      <text x="80" y="21" class="ts dim">Simulador</text>

      <text x="146" y="21" class="ts dim">Estratégia</text>
      <rect x="204" y="8" width="148" height="19" fill="#ffffff" stroke="#b9b0a4"/>
      <text x="210" y="21" class="ts ink">Cruzamento de médias ▾</text>
      <rect x="356" y="8" width="21" height="19" class="btn"/><text x="362" y="21" class="ts ink">⚙</text>

      <text x="392" y="21" class="ts dim">Custo</text>
      <text x="428" y="21" class="ts ink" font-weight="600">6,5 pts</text>

      <text x="10" y="46" class="ts dim">Período</text>
      <rect x="56" y="33" width="86" height="19" fill="#ffffff" stroke="#b9b0a4"/>
      <text x="62" y="46" class="ts ink">Tudo ▾</text>

      <text x="152" y="46" class="ts dim">À frente</text>
      <rect x="204" y="33" width="66" height="19" fill="#ffffff" stroke="#b9b0a4"/>
      <text x="210" y="46" class="ts ink">1/3 ▾</text>

      <text x="282" y="46" class="ts dim">Fatias</text>
      <rect x="322" y="33" width="86" height="19" fill="#ffffff" stroke="#b9b0a4"/>
      <text x="328" y="46" class="ts ink">Trimestre ▾</text>

      <rect x="560" y="19" width="72" height="22" class="on"/>
      <text x="576" y="34" class="ts" fill="#ffffff">▶ Rodar</text>
      <rect x="640" y="24" width="88" height="11" fill="#ffffff" stroke="#b9b0a4"/>
      <rect x="641" y="25" width="60" height="9" class="on"/>
      <line x1="0" y1="56" x2="740" y2="56" class="rule"/>
    </g>

    <!-- (2) resultado -->
    <g transform="translate(0,445)">
      <rect x="1" y="0" width="738" height="26" fill="#f4f1ec"/>
      <rect x="8" y="4" width="56" height="20" fill="#ffffff" stroke="#b9b0a4"/><text x="18" y="18" class="ts ink">Resumo</text>
      <rect x="68" y="4" width="70" height="20" class="btn"/><text x="76" y="18" class="ts dim">Operações</text>
      <rect x="142" y="4" width="50" height="20" class="btn"/><text x="152" y="18" class="ts dim">Curva</text>
      <rect x="196" y="4" width="76" height="20" class="btn"/><text x="204" y="18" class="ts dim">Distribuição</text>
      <text x="712" y="18" class="ts dim">▲</text>
      <line x1="0" y1="26" x2="740" y2="26" class="rule"/>

      <g transform="translate(0,26)">
        <rect x="1" y="0" width="738" height="278" fill="#ffffff"/>

        <text x="188" y="22" class="ts dim">Amostra</text>
        <text x="330" y="22" class="ts" fill="#b06a2c" font-weight="600">À frente</text>
        <text x="470" y="22" class="ts dim">Trivial da fatia</text>
        <line x1="16" y1="30" x2="600" y2="30" class="hair"/>

        <g class="ts">
          <text x="16"  y="50" class="dim">Operações</text>
          <text x="188" y="50" class="num ink">412</text>
          <text x="330" y="50" class="num ink">137</text>
          <text x="470" y="50" class="num faint">—</text>

          <text x="16"  y="74" class="dim">Acerto</text>
          <text x="188" y="74" class="num ink">43,1%</text>
          <text x="330" y="74" class="num ink">41,8%</text>
          <text x="470" y="74" class="num ink">46,4%</text>

          <text x="16"  y="98" class="dim">Bruto</text>
          <text x="188" y="98" class="num up">+2.140</text>
          <text x="330" y="98" class="num up">+310</text>
          <text x="470" y="98" class="num faint">—</text>

          <text x="16"  y="122" class="dim">Custo</text>
          <text x="188" y="122" class="num down">−2.678</text>
          <text x="330" y="122" class="num down">−890</text>
          <text x="470" y="122" class="num faint">—</text>
        </g>
        <line x1="16" y1="134" x2="600" y2="134" class="hair"/>
        <g class="ts">
          <text x="16"  y="156" class="ink" font-weight="600">Líquido</text>
          <text x="188" y="156" class="num down" font-weight="600">−538</text>
          <text x="330" y="156" class="num down" font-weight="600">−580</text>
          <text x="470" y="156" class="num faint">—</text>

          <text x="16"  y="180" class="dim">Por operação</text>
          <text x="188" y="180" class="num down">−1,31</text>
          <text x="330" y="180" class="num down">−4,23</text>
          <text x="470" y="180" class="num faint">—</text>
        </g>

        <rect x="16" y="200" width="584" height="26" fill="#fdf4e8" stroke="#e0bb8a"/>
        <text x="26" y="217" class="ts ink">⚠  3 operações (0,7%) tocaram stop e alvo na mesma barra — resolvidas pelo stop.</text>

        <rect x="16" y="234" width="584" height="26" fill="#fdf4e8" stroke="#e0bb8a"/>
        <text x="26" y="251" class="ts ink">⚠  À frente piorou por operação: o resultado da amostra não replicou.</text>
      </g>
      <line x1="0" y1="304" x2="740" y2="304" class="rule"/>
