      <rect x="1" y="0" width="672" height="20" fill="#f4f1ec"/>
      <text x="46" y="14" class="ts dim">09:00</text><text x="166" y="14" class="ts dim">10:00</text>
      <text x="286" y="14" class="ts dim">11:00</text><text x="406" y="14" class="ts dim">12:00</text>
      <text x="526" y="14" class="ts dim">13:00</text>
      <line x1="0" y1="20" x2="740" y2="20" class="rule"/>
      <rect x="1" y="20" width="672" height="18" fill="#eae5dd"/>
      <text x="130" y="33" class="ts ink">02/09</text>
      <line x1="340" y1="20" x2="340" y2="38" class="rule"/>
      <text x="470" y="33" class="ts ink">03/09</text>
