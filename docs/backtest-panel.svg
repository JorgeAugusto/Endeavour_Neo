        <rect x="21" y="0" width="17" height="17" class="btn"/><line x1="29" y1="2" x2="29" y2="15" class="rule"/><rect x="26" y="5" width="6" height="7" fill="none" stroke="#23201d"/>
        <rect x="42" y="0" width="17" height="17" class="btn"/><polyline points="45,14 50,7 55,11 58,3" fill="none" stroke="#23201d"/>
