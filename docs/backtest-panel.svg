  <!-- ================= chamadas ================= -->
  <g>
    <g transform="translate(806,478)">
      <circle cx="0" cy="0" r="11" class="on"/><text x="-4" y="4" class="call">1</text>
      <text x="22" y="-2" class="cap ink" font-weight="600">Linha de comando</text>
      <text x="22" y="16" class="cap dim">Sempre visível. A ⚙ abre o diálogo</text>
      <text x="22" y="32" class="cap dim">com Execução, Posição, Risco, Custos.</text>
    </g>
    <line x1="795" y1="478" x2="782" y2="478" stroke="#b06a2c" marker-end="url(#arrow)"/>

    <g transform="translate(806,560)">
      <circle cx="0" cy="0" r="11" class="on"/><text x="-4" y="4" class="call">2</text>
      <text x="22" y="-2" class="cap ink" font-weight="600">Resultado, recolhível</text>
      <text x="22" y="16" class="cap dim">Amostra e à frente lado a lado, sempre.</text>
      <text x="22" y="32" class="cap dim">O trivial é o da fatia, nunca o global.</text>
    </g>
    <line x1="795" y1="560" x2="782" y2="560" stroke="#b06a2c" marker-end="url(#arrow)"/>

    <g transform="translate(806,240)">
      <circle cx="0" cy="0" r="11" class="on"/><text x="-4" y="4" class="call">3</text>
      <text x="22" y="-2" class="cap ink" font-weight="600">Marcas e fronteira</text>
      <text x="22" y="16" class="cap dim">▲ entrada, ▼ saída. A linha tracejada</text>
      <text x="22" y="32" class="cap dim">é onde começa o teste à frente.</text>
      <text x="22" y="48" class="cap dim">Clicar numa operação leva o gráfico até ela.</text>
    </g>
    <line x1="795" y1="240" x2="782" y2="240" stroke="#b06a2c" marker-end="url(#arrow)"/>

    <g transform="translate(806,690)">
      <circle cx="0" cy="0" r="11" class="on"/><text x="-4" y="4" class="call">4</text>
      <text x="22" y="-2" class="cap ink" font-weight="600">Avisos, não notas de rodapé</text>
      <text x="22" y="16" class="cap dim">Barras ambíguas e falha de réplica</text>
      <text x="22" y="32" class="cap dim">aparecem junto do número que elas</text>
      <text x="22" y="48" class="cap dim">contaminam.</text>
    </g>
    <line x1="795" y1="690" x2="782" y2="690" stroke="#b06a2c" marker-end="url(#arrow)"/>

    <g transform="translate(806,110)">
      <text x="0" y="0" class="cap ink" font-weight="600">De onde veio</text>
      <text x="0" y="20" class="cap dim">ta4j — motor, execução na abertura</text>
      <text x="0" y="36" class="cap dim">seguinte, custos, 31 métricas</text>
      <text x="0" y="56" class="cap dim">MetaTrader — teste à frente embutido,</text>
      <text x="0" y="72" class="cap dim">distribuição, saldo × patrimônio</text>
      <text x="0" y="92" class="cap dim">Profit — as quatro seções atrás da ⚙</text>
      <text x="0" y="112" class="cap dim">endeavour — custo 6,5, trivial por fatia</text>
    </g>
  </g>
</svg>
